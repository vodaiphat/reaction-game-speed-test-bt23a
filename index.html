
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập 23a - Reaction Speed Test</title>

    <!-- Liên kết file CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>⚡ REACTION SPEED TEST</h1>
    <p class="description">
        Thử thách tốc độ phản xạ của bạn!
    </p>

    <!-- Khu vực thông tin -->
    <div class="info">
        <div class="info-box">
            <h3>🏆 ĐIỂM SỐ</h3>
            <span id="score">0</span>
        </div>

        <div class="info-box">
            <h3>⏱ THỜI GIAN</h3>
            <span id="time">30</span>
        </div>
    </div>

    <!-- Chọn thời gian chơi -->
    <div class="settings">
        <label for="duration">Thời gian chơi:</label>

        <select id="duration">
            <option value="15">15 giây</option>
            <option value="30" selected>30 giây</option>
            <option value="45">45 giây</option>
            <option value="60">60 giây</option>
        </select>
    </div>

    <!-- Khu vực trò chơi -->
    <div id="arena">
        <div id="target"></div>
    </div>

    <!-- Các nút chức năng -->
    <div class="buttons">
        <button id="startBtn">Bắt đầu trò chơi</button>

        <button id="colorBtn">🎨 Đổi màu nền trò chơi</button>

        <button id="playerBtn">👤 Người chơi</button>
    </div>

    <div id="playerInfo"></div>

    <div id="message">
        Nhấn bắt đầu để thử sức nhé!
    </div>

    <!-- Liên kết file JavaScript -->
    <script src="script.js"></script>

</body>
</html>
